name: Automated G1 Data, Odds & Results Sync

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC)
    - cron: '0 0 * * *'
    # 毎週金曜 18:30 JST (09:30 UTC) - JRA金曜夜間馬券発売開始時刻
    - cron: '30 9 * * 5'
    # 毎週日曜 16:00 JST (07:00 UTC) - G1レース発走・結果確定直後
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "auto-sync"
  cancel-in-progress: false

jobs:
  auto_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Run Auto-Update Engine
        run: |
          python3 scripts/auto_update_system.py

      - name: Build with Vite
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
