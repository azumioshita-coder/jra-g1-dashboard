name: Automated JRA G1 Data, Odds & Results Sync

on:
  schedule:
    # 毎時 00分に定期自動同期 (出走馬確定・枠順・最新オッズ)
    - cron: '0 * * * *'
    # 毎週金曜 18:30〜23:30 JST (09:30〜14:30 UTC) - JRA夜間馬券発売開始・確定オッズ追跡
    - cron: '*/30 9-14 * * 5'
    # 毎週日曜 09:00〜17:00 JST (00:00〜08:00 UTC) - 馬体重発表・リアルタイムオッズ・レース結果確定
    - cron: '*/30 0-8 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/auto_update_system.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "auto-sync"
  cancel-in-progress: false

jobs:
  auto_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Run Auto-Update Engine (NetKeiba & JRA Sync)
        run: |
          python3 scripts/auto_update_system.py

      - name: Build with Vite
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
